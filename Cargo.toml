[package]
name = "syntra_lang"
version = "0.1.0"
authors = ["Alex Roussinov <gd2bk1ng@proton.me>"]
edition = "2024"
description = """
SyntraLang: an intent-oriented language core for AI, symbolic reasoning,
cognitive systems, and future Syntra Kernel tooling.
"""
license = "MIT OR Apache-2.0"
repository = "https://github.com/gd2bk1ng/astra_lang"
readme = "README.md"
keywords = ["programming-language", "AI", "intent", "symbolic-reasoning", "cognitive"]
categories = ["programming-language", "artificial-intelligence", "domain-specific-language"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-ident = "1.0"

[package.metadata.docs.rs]
all-features = true
